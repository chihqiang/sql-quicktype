<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SQL Quicktype - SQL Parser</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'Courier New', 'monospace'],
          },
        },
      }
    }
  </script>

</head>
<body class="bg-gray-50 min-h-screen py-6 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-gray-900 mb-1">SQL Quicktype</h1>
      <p class="text-lg text-gray-600">SQL Parser & Code Generator</p>
    </div>
    
    <!-- Main Content -->
    <div class="bg-white rounded-xl shadow-lg p-4 sm:p-6">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- SQL Input Section -->
        <div>
          <div class="flex flex-wrap justify-between items-center mb-3">
            <h2 class="text-lg font-semibold text-gray-800">SQL Input</h2>
            
            <!-- Actions Section -->
            <div class="flex flex-wrap gap-2">
              <button onclick="parseSQL()" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm">
                Parse SQL
              </button>
              <button onclick="generateTypeScript()" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm">
                TypeScript
              </button>
              <button onclick="generateGorm()" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm">
                GORM
              </button>
              <button onclick="generateGo()" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm">
                Go
              </button>
              <button onclick="generateXorm()" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm">
                XORM
              </button>
              <button onclick="clearAll()" class="px-3 py-1 bg-gray-600 text-white font-medium rounded-md shadow hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 text-sm">
                Clear
              </button>
            </div>
          </div>
          
          <textarea id="sqlInput" placeholder="Enter your SQL DDL statements here..." class="w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 resize-vertical min-h-[450px] font-mono text-sm">CREATE TABLE users (
  id INT PRIMARY KEY AUTO_INCREMENT,
  name VARCHAR(255) NOT NULL,
  email VARCHAR(255) UNIQUE,
  created_at DATETIME DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE posts (
  id INT PRIMARY KEY AUTO_INCREMENT,
  user_id INT REFERENCES users(id),
  title VARCHAR(255) NOT NULL,
  content TEXT
);</textarea>
        </div>
        
        <!-- Result Section -->
        <div>
          <div class="flex justify-between items-center mb-3">
            <h2 class="text-lg font-semibold text-gray-800">Result</h2>
            <button onclick="copyResult()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-gray-400">
              <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
              Copy
            </button>
          </div>
          <div id="resultContent" class="p-4 border border-gray-300 rounded-md bg-gray-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="dist/index.global.js"></script>
  <script>
    // Use the global sqlQuicktype object
    
    window.parseSQL = function() {
      const sqlInput = document.getElementById('sqlInput').value;
      const resultContent = document.getElementById('resultContent');
      
      if (!sqlInput) {
        resultContent.className = 'p-4 border-2 border-red-300 rounded-md bg-red-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed text-red-700';
        resultContent.textContent = 'Please enter SQL DDL statements.';
        return;
      }
      
      try {
        const result = sqlQuicktype.parseSQL(sqlInput, {
          dialect: 'mysql'
        });
        
        resultContent.className = 'p-4 border-2 border-green-300 rounded-md bg-green-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed text-green-700';
        resultContent.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        resultContent.className = 'p-4 border-2 border-red-300 rounded-md bg-red-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed text-red-700';
        resultContent.textContent = `Error: ${error.message}`;
      }
    };
    
    window.generateTypeScript = function() {
      generateCode('typescript');
    };
    
    window.generateGorm = function() {
      generateCode('gorm');
    };
    
    window.generateGo = function() {
      generateCode('go');
    };
    
    window.generateXorm = function() {
      generateCode('xorm');
    };
    
    window.generateCode = async function(language) {
      const sqlInput = document.getElementById('sqlInput').value;
      const resultContent = document.getElementById('resultContent');
      
      if (!sqlInput) {
        resultContent.className = 'p-4 border-2 border-red-300 rounded-md bg-red-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed text-red-700';
        resultContent.textContent = 'Please enter SQL DDL statements.';
        return;
      }
      
      try {
        const code = await sqlQuicktype.generateCode(sqlInput, {
          language: language,
          mode: 'single',
          namespace: 'models',
          dialect: 'mysql',
          dbName: 'my_database'
        });
        
        resultContent.className = 'p-4 border-2 border-green-300 rounded-md bg-green-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed text-green-700';
        resultContent.textContent = code;
      } catch (error) {
        resultContent.className = 'p-4 border-2 border-red-300 rounded-md bg-red-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed text-red-700';
        resultContent.textContent = `Error: ${error.message}`;
      }
    };
    
    window.clearAll = function() {
      document.getElementById('sqlInput').value = '';
      document.getElementById('resultContent').textContent = '';
      document.getElementById('resultContent').className = 'p-4 border border-gray-300 rounded-md bg-gray-50 font-mono text-sm min-h-[450px] max-h-[450px] overflow-y-auto whitespace-pre-wrap leading-relaxed';
    };
    
    window.copyResult = function() {
      const resultContent = document.getElementById('resultContent');
      const text = resultContent.textContent;
      
      if (!text) {
        alert('No content to copy!');
        return;
      }
      
      navigator.clipboard.writeText(text).then(function() {
        // Show success feedback
        const originalText = resultContent.textContent;
        resultContent.textContent = 'Copied to clipboard!';
        
        // Restore original content after 2 seconds
        setTimeout(function() {
          resultContent.textContent = originalText;
        }, 2000);
      }).catch(function(err) {
        console.error('Failed to copy: ', err);
        alert('Failed to copy content!');
      });
    };
    

  </script>
</body>
</html>
